name: Build and Release (On Demand)

# Only runs when triggered manually
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Tag Version (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'

jobs:
  build-and-release:
    runs-on: windows-latest

    permissions:
      contents: write # Needed to create the Git tag and publish the Release

    env:
      RELOADEDIIMODS: ${{ github.workspace }}/temp_mods

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore NuGet Packages
        run: dotnet restore

      - name: Publish Mod
        run: >
          dotnet publish -c Release
          --no-restore
          -o "${{ github.workspace }}/publish/fftivc.ext.beastmaster"

      - name: Clean unnecessary files (.pdb, .xml)
        shell: pwsh
        run: |
          Get-ChildItem -Path "${{ github.workspace }}/publish/fftivc.ext.beastmaster" -Include *.pdb, *.xml -Recurse | Remove-Item -Force

      - name: Package Mod (.zip)
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ github.workspace }}/publish/fftivc.ext.beastmaster/*" -DestinationPath "${{ github.workspace }}/fftivc.ext.beastmaster-${{ github.event.inputs.version }}.zip" -Force

      # 1. Uploads to the workflow run's "Artifacts" section
      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fftivc.ext.beastmaster-${{ github.event.inputs.version }}
          path: ${{ github.workspace }}/fftivc.ext.beastmaster-${{ github.event.inputs.version }}.zip
          retention-days: 30

      # 2. Creates the official Git tag and publishes to the "Releases" section
      - name: Create Git Tag and GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Beastmaster Extensions ${{ github.event.inputs.version }}
          draft: false
          prerelease: false
          files: ${{ github.workspace }}/fftivc.ext.beastmaster-${{ github.event.inputs.version }}.zip
          body: |
            ### Beastmaster Extensions ${{ github.event.inputs.version }}
            - Fully updated for Final Fantasy Tactics version **1.5.2**.
            - Fixed `CalculateHeightData` function address resolution.
            - Corrected pointer arithmetic when fetching unit IDs.
